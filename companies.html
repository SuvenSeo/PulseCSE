<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Browse mock Colombo Stock Exchange companies, sectors, prices, and watchlist status." />
  <title>Companies | PulseCSE</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <div class="site-shell app-layout">
    <header class="topbar" data-component="nav"></header>

    <main>
      <section class="page-heading reveal">
        <div>
          <p class="label">Company Directory</p>
          <h1>Browse tracked CSE counters</h1>
          <p>Search symbols, filter by sector, and add counters to the watchlist.</p>
        </div>
      </section>

      <section class="filter-bar glass-card reveal delay-1">
        <label class="sr-only" for="company-search">Search companies</label>
        <input id="company-search" type="search" placeholder="Search by symbol, company, or sector" />
        <label class="sr-only" for="sector-filter">Sector filter</label>
        <select id="sector-filter">
          <option value="all">All sectors</option>
        </select>
      </section>

      <section class="company-grid reveal delay-2" id="company-grid" aria-label="Company cards"></section>
    </main>
  </div>

  <div class="toast-region" id="toast-region" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/companies.js"></script>
</body>
</html>
