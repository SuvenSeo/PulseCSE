[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsecse"
version = "3.0.0"
description = "High-end full-stack Colombo Stock Exchange alert cockpit with backend, database, alert engine, simulation lab, and frontend dashboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "pydantic>=2"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 120
target-version = "py311"
